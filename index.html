<style>
  :root{
    --navy:#0A1A2F; --gold:#E0B04A; --gold-bright:#EFC25E; --gold-deep:#C8923B;
    --cream:#F5F0E8; --muted:#8A97A8; --line:#24395790; --soft:#C9D3DF;
    --low:#E07A5A; --mid:#E8B44C; --good:#6FBF8E;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{min-height:100%;background-color:#0A1A2F}
  body{
    font-family:'Manrope',sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased;
    background-color:#0A1A2F;
    background:
      radial-gradient(1100px 600px at 78% -8%, rgba(224,176,74,.10), transparent 60%),
      radial-gradient(900px 700px at 8% 110%, rgba(224,176,74,.05), transparent 55%),
      linear-gradient(170deg,#0A1A2F 0%,#0C1F36 55%,#0A182C 100%) #0A1A2F;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a{color:var(--gold)}
  .progress-wrap{position:fixed;top:0;left:0;right:0;height:4px;background:#0A1A2Fcc;z-index:10}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold-bright));transition:width .45s ease}
  .shell{flex:1;display:flex;justify-content:center;padding:56px 22px 48px}
  .card{width:100%;max-width:640px;margin:auto 0}
  .fade{animation:rise .4s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.fade{animation:none}.progress-bar{transition:none}}

  .brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:34px}
  .brand .dot{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--gold-bright),var(--gold-deep));position:relative;flex:none;box-shadow:0 0 18px rgba(224,176,74,.35)}
  .brand .dot::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--navy)}
  .brand .name{font-family:'Archivo',sans-serif;font-weight:800;letter-spacing:.16em;font-size:15px}
  .brand .name b{color:var(--gold)}

  .eyebrow{font-family:'Archivo';font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:16px;text-align:center}
  h1{font-family:'Archivo',sans-serif;font-weight:800;line-height:1.06;font-size:clamp(30px,6vw,44px);text-align:center;margin-bottom:16px}
  h1 .hl{color:var(--gold)}
  .sub{text-align:center;color:var(--soft);font-size:17px;line-height:1.55;max-width:560px;margin:0 auto 14px}
  .sub2{text-align:center;color:var(--muted);font-size:15px;line-height:1.55;max-width:560px;margin:0 auto 24px}
  .pillars-intro{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 22px;max-width:580px}
  .chip{font-size:13px;background:rgba(224,176,74,.07);border:1px solid var(--line);padding:7px 12px;border-radius:30px}
  .meta{display:flex;justify-content:center;gap:12px;color:var(--muted);font-size:13.5px;margin-bottom:26px;flex-wrap:wrap}
  .meta b{color:var(--cream);font-weight:600}
  .fineprint{text-align:center;font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:16px}

  .q-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .q-count{font-family:'Archivo';font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;color:var(--gold)}
  .q-pillar{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:4px 10px}
  .q-text{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(21px,3.5vw,27px);line-height:1.25;margin-bottom:8px}
  .q-help{color:var(--muted);font-size:14.5px;margin-bottom:22px;line-height:1.5}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;background:rgba(255,255,255,.02);border:1.5px solid var(--line);border-radius:14px;padding:16px 17px;color:var(--cream);font-size:15.5px;font-family:'Manrope';font-weight:500;line-height:1.4;transition:border-color .15s,background .15s}
  .opt:hover{border-color:rgba(224,176,74,.55);background:rgba(224,176,74,.06)}
  .opt.na{border-style:dashed;color:var(--soft)}
  .opt:focus-visible,.btn:focus-visible,.back:focus-visible,.linkbtn:focus-visible,.choice:focus-within{outline:2px solid var(--gold-bright);outline-offset:3px}
  .opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .opt .tick::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--gold);transform:scale(0);transition:transform .15s}
  .opt.sel{border-color:var(--gold);background:rgba(224,176,74,.10)}
  .opt.sel .tick{border-color:var(--gold)}
  .opt.sel .tick::after{transform:scale(1)}

  .nav{display:flex;align-items:center;justify-content:space-between;margin-top:26px;gap:14px;min-height:52px}
  .back{background:none;border:none;color:var(--muted);font-family:'Manrope';font-weight:600;font-size:14.5px;cursor:pointer;padding:10px 4px}
  .back:hover{color:var(--cream)}
  .btn{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.04em;font-size:15px;text-transform:uppercase;cursor:pointer;border:none;border-radius:12px;padding:16px 28px;color:#2A1B05;background:linear-gradient(135deg,var(--gold-bright),var(--gold-deep));box-shadow:0 8px 24px rgba(224,176,74,.25);text-decoration:none;display:inline-block;text-align:center}
  .btn:hover{filter:brightness(1.05)}
  .btn[disabled]{opacity:.6;cursor:wait}
  .btn.full{width:100%}
  .btn.ghost{background:none;border:1.5px solid var(--gold);color:var(--cream);box-shadow:none}
  .btn.ghost:hover{background:rgba(224,176,74,.08)}
  .linkbtn{background:none;border:none;color:var(--muted);font-family:'Manrope';font-size:14px;cursor:pointer;text-decoration:underline;padding:8px}
  .linkbtn:hover{color:var(--gold)}

  .field{margin-bottom:16px}
  .field label,.fs-label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:7px}
  .field input{width:100%;background:rgba(255,255,255,.03);border:1.5px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--cream);font-family:'Manrope';font-size:16px}
  .field input:focus{outline:none;border-color:var(--gold)}
  .field input[aria-invalid="true"]{border-color:var(--low)}
  .err{color:#F0A890;font-size:13px;margin-top:6px}
  .explain{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--soft);line-height:1.55;margin:4px 0 18px}
  fieldset{border:none;margin:0 0 6px}
  legend.fs-label{color:var(--cream);font-size:15px;line-height:1.45;margin-bottom:10px;font-weight:600}
  .choice{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px;color:var(--cream);line-height:1.45;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px}
  .choice:has(input:checked){border-color:var(--gold);background:rgba(224,176,74,.08)}
  .choice input{width:19px;height:19px;margin-top:1px;accent-color:var(--gold);flex:none;cursor:pointer}
  .small{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 18px}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .score-ring{position:relative;width:180px;height:180px;margin:4px auto 20px}
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-ring .num{font-family:'Archivo';font-weight:900;font-size:50px;line-height:1}
  .score-ring .den{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.1em}
  .band{font-family:'Archivo';font-weight:800;font-size:clamp(22px,4.3vw,30px);text-align:center;margin-bottom:6px;text-transform:uppercase;letter-spacing:.02em}
  .band-tag{text-align:center;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;font-family:'Archivo';margin-bottom:18px}
  .body-text{color:var(--soft);font-size:16px;line-height:1.62;margin-bottom:14px}
  .disclaimer{font-size:12.5px;color:var(--muted);line-height:1.55;border-left:2px solid var(--gold-deep);padding:4px 0 4px 12px;margin:6px 0 22px}
  h3{font-family:'Archivo';font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}
  .dim-row{padding:11px 14px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:rgba(255,255,255,.018)}
  .dim-head{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:7px}
  .dim-head span:last-child{font-family:'Archivo';font-weight:800}
  .bar{height:7px;border-radius:7px;background:#1B2E48;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:7px;width:0;transition:width 1s ease}
  .strong-line{font-size:14px;color:var(--soft);margin-top:10px}
  .strong-line b{color:#8FD3A9}
  .prio{display:flex;gap:14px;border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;background:rgba(255,255,255,.02)}
  .prio .n{font-family:'Archivo';font-weight:900;font-size:22px;color:var(--gold);line-height:1;flex:none;width:20px}
  .prio strong{display:block;font-size:15.5px;margin-bottom:4px}
  .prio p{font-size:14.5px;color:var(--soft);line-height:1.55}
  .note{border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.55;margin:10px 0}
  .note b{display:block;margin-bottom:3px}
  .note.safety{background:rgba(127,184,201,.10);border:1px solid rgba(127,184,201,.45);color:#D6EAF0}
  .note.cast{background:rgba(224,176,74,.08);border:1px solid rgba(224,176,74,.4);color:#F3E3BD}
  .note.time{background:rgba(224,122,90,.10);border:1px solid rgba(224,122,90,.4);color:#F0CDBE}
  .notice{border-radius:12px;padding:13px 15px;font-size:14px;line-height:1.5;margin:0 0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .notice.ok{background:rgba(111,191,142,.10);border:1px solid rgba(111,191,142,.4);color:#CDEBD8}
  .notice.warn{background:rgba(232,180,76,.10);border:1px solid rgba(232,180,76,.45);color:#F3DFB3}
  .notice .btn{padding:10px 16px;font-size:13px}
  .cta-box{border:1px solid rgba(224,176,74,.45);background:rgba(224,176,74,.07);border-radius:14px;padding:22px 18px;margin-top:26px}
  .cta-box h4{font-family:'Archivo';font-weight:800;font-size:19px;line-height:1.3;margin-bottom:8px}
  .cta-box p{color:var(--soft);font-size:15px;line-height:1.6;margin-bottom:8px}
  .cta-box .deliver{font-size:13px;color:var(--muted);margin-bottom:16px}
  .club{border:1px dashed rgba(224,176,74,.5);border-radius:14px;padding:20px 18px;margin-top:14px;background:rgba(255,255,255,.02)}
  .club .eyebrow{text-align:left;margin-bottom:8px}
  .club p{color:var(--soft);font-size:14.5px;line-height:1.6;margin-bottom:14px}
  .club .done{color:#CDEBD8;font-weight:600;font-size:15px}
  .center{text-align:center}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(42,27,5,.3);border-top-color:#2A1B05;border-radius:50%;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle}
  .btn.ghost .spinner{border-color:rgba(245,240,232,.3);border-top-color:var(--cream)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:520px){
    .shell{padding:46px 16px 36px}
    .opt{padding:14px 14px;font-size:15px}
  }
</style>
</head>
<body>
<div class="progress-wrap" aria-hidden="true"><div class="progress-bar" id="bar"></div></div>
<main class="shell"><div class="card" id="card" aria-live="polite"></div></main>

<script>
/* =================================================================
   CONFIG. Gabriel: check these values before deploy.
   ================================================================= */
const CONFIG = {
  SUBMIT_URL:    "",                                     // stores submission, sends results email + admin notification
  WAITLIST_URL:  "",                                     // records Club waitlist join for a submission
  WEB3FORMS_KEY: "bcaa3916-d6ca-47c1-a66e-b24a723fb3bb", // fallback notification to info@ if the endpoints fail
  REVIEW_URL:    "https://go.cirquenastics.com/b/performance-review", // exact £67 Performance Review product page
  PRIVACY_URL:   "privacy.html",                         // must exist before launch
  VERSION:       "2.1"
};
const MARKETING_TEXT = "Yes, send me Cirquenastics training tips and updates.";
const WAITLIST_TEXT  = "Join the Cirquenastics Club waitlist: be one of the first to know when membership opens.";

/* =================================================================
   DIMENSIONS AND QUESTIONS (pages 2 to 18 of the brief)
   ================================================================= */
const DIMS = [
  { id:"strength",    name:"Strength" },
  { id:"mobility",    name:"Mobility" },
  { id:"endurance",   name:"Endurance" },
  { id:"control",     name:"Technical Control" },
  { id:"consistency", name:"Consistency" },
  { id:"confidence",  name:"Confidence" },
  { id:"presence",    name:"Stage Presence" }
];

const GOALS = [
  "Getting stronger and improving my overall performance",   // 0 general
  "Staying performance-ready while currently working",       // 1 working professional
  "Preparing for a professional audition or casting",        // 2 audition
  "Preparing for circus school",                             // 3 school
  "Preparing for a new contract or fitness assessment",      // 4 contract
  "Returning to training after time away",                   // 5 returning
  "I don't have a specific goal yet"                         // 6 general
];
const goalIdx = () => state.answers.goal;
const hasOpportunity = () => [2,3,4].includes(goalIdx());
const isCasting = () => [2,3].includes(goalIdx());

// kind: profile | scored | context. opts: [label, points] ; points null = not scored ; na:true = excluded from calculation
const ITEMS = [
  { id:"goal", kind:"profile", q:"What are you working toward right now?", help:"This helps personalise your result.",
    opts: GOALS.map(g=>[g,null]) },
  { id:"timeline", kind:"profile", show:hasOpportunity, q:"When do you need to be ready?", help:"",
    opts:[["Within 4 weeks",null],["5 to 12 weeks",null],["3 to 6 months",null],["More than 6 months",null],["No fixed date",null]] },
  { id:"discipline", kind:"profile", q:"What is your primary discipline?", help:"",
    opts:[["Aerial: silks, hoop, straps, rope, trapeze, cradle, etc.",null],["Hand to hand / partner acrobatics",null],["Hand balancing",null],["Floor acrobatics / tumbling",null],["Dance / movement",null],["Contortion",null],["Gymnastics transitioning to circus",null],["Other / multidisciplinary",null]] },
  { id:"level", kind:"profile", q:"What best describes you right now?", help:"",
    opts:[["Recreational / early stage performer",null],["Developing circus student",null],["Advanced / pre-professional performer",null],["Professional performer",null],["Established professional performer",null]] },

  { id:"strength_general", kind:"scored", dim:"strength", q:"How well does your current strength support the skills and demands of your discipline?",
    help:"Answer based on what you can do consistently, not your best ever day.",
    opts:[["Strength regularly limits my skills or training",0],["I can manage basic demands, but strength still limits progress",1],["My strength supports most of what I need to do",2],["My strength reliably supports my current skills and workload",3]] },
  { id:"pullups", kind:"scored", dim:"strength", q:"Strict pull ups, no kipping. How many can you perform in one clean set?",
    help:"Pulling strength is an important physical quality across many circus disciplines.",
    opts:[["0 to 2",0],["3 to 6",1],["7 to 12",2],["13 or more",3],["I haven't tested this / it is not relevant to my training",null,true]] },
  { id:"control_entry", kind:"scored", dim:"control", q:"When performing skills that are already within your ability, how consistently can you maintain control from entry to exit?", help:"",
    opts:[["I often lose alignment or control",0],["I can control the main skill, but entries and exits are inconsistent",1],["I usually maintain good control",2],["I consistently maintain clean control through the entire movement",3]] },
  { id:"mobility_general", kind:"scored", dim:"mobility", q:"Do you have the usable mobility required for your discipline?",
    help:"Think about shoulders, hips, spine and any flexibility positions your skills require.",
    opts:[["Mobility regularly limits my skills",0],["I have noticeable restrictions",1],["I have most of the mobility I need",2],["I have the mobility and control required for my skills",3]] },
  { id:"overhead", kind:"scored", dim:"mobility", q:"Can you reach a comfortable full overhead position without compensating through your lower back?", help:"",
    opts:[["Not yet",0],["Partially",1],["Mostly",2],["Yes, comfortably and with control",3]] },
  { id:"continuous", kind:"scored", dim:"endurance", q:"Can you perform continuously for 3 to 4 minutes while maintaining technique and performance quality?", help:"",
    opts:[["Technique falls apart quickly",0],["I can continue, but quality drops noticeably",1],["I maintain most of my quality with some fatigue",2],["I maintain strong quality from beginning to end",3]] },
  { id:"fatigue", kind:"scored", dim:"endurance", q:"When you become fatigued, how well does your movement quality hold up?",
    help:"Think about alignment, pointed feet where relevant, timing, control, landings and movement finishes.",
    opts:[["It deteriorates significantly",0],["There is a noticeable drop",1],["There is only a small drop",2],["My performance quality stays consistent",3]] },
  { id:"routine", kind:"scored", dim:"consistency", q:"How consistently do you follow a structured physical training routine?", help:"",
    opts:[["Rarely",0],["I train, but without much structure",1],["I follow a routine most weeks",2],["I train consistently with a clear structure and progression",3]] },
  { id:"prep", kind:"scored", dim:"consistency", q:"How consistent are you with warm ups, physical preparation and recovery?", help:"",
    opts:[["Rarely consistent",0],["Sometimes",1],["Most of the time",2],["Consistently",3]] },
  { id:"injury", kind:"context", q:"In the past 12 months, has pain or injury significantly interrupted your training or performing?",
    help:"This does not affect your score.",
    opts:[["Currently dealing with pain or injury",null],["Yes, several times",null],["Once or twice",null],["Rarely or never",null]] },
  { id:"confidence", kind:"scored", dim:"confidence", q:"How confident are you performing when the pressure increases?",
    help:"This could mean an audience, casting team, coach, camera or an important performance.",
    opts:[["Nerves regularly affect my performance",0],["I become noticeably less consistent",1],["I generally perform well despite nerves",2],["I feel confident and perform consistently under pressure",3]] },
  { id:"presence", kind:"scored", dim:"presence", q:"How well do you turn your skills into a performance?",
    help:"Technique matters, but performance is also about what the audience feels while watching you. Think about movement finishes, transitions, musicality, expression, intention and holding an audience's attention.",
    opts:[["I mainly focus on completing the skills",0],["I add some performance quality, but inconsistently",1],["I consciously perform with expression and intention",2],["I consistently connect movement, technique and expression to engage the audience",3]] },
  { id:"footage", kind:"context", show:isCasting, q:"Do you have recent, high quality footage that accurately represents your current level?",
    help:"This does not affect your score.",
    opts:[["No",null],["Partial or outdated",null],["Yes, but it needs improvement",null],["Yes, my current material represents me well",null]] }
];

const BANDS = [
  { max:39,  key:"building",   name:"Building Foundations", color:"#E07A5A",
    text:"You are at the foundation stage. That is useful information, not a verdict. Focused, consistent work on your three priorities below will make the biggest difference to your preparation." },
  { max:59,  key:"developing", name:"Developing Preparation", color:"#E8B44C",
    text:"You have a developing base. Your answers point to a few clear areas where focused work would lift both your preparation and your performance quality." },
  { max:79,  key:"strongbase", name:"Strong Base, Clear Priorities", color:"#7FB8C9",
    text:"You have an established foundation. Your answers suggest a few areas where focused work could improve your preparation and performance quality." },
  { max:100, key:"strongprep", name:"Strong Performance Preparation", color:"#6FBF8E",
    text:"Your answers suggest strong, well rounded preparation. The gains now come from refining your lowest areas and keeping your quality consistent under real performance demands." }
];

const REC = {
  strength:"Build strength that directly supports your skills: strict pulling, core and pressing work two to three times a week, progressed steadily rather than maxed out.",
  mobility:"Focus on the usable range of motion that directly supports your discipline and technical positions, and practise holding end positions with control.",
  endurance:"Train for the length of your act: continuous sets that match your routine time, stop when quality drops, and extend the duration week by week.",
  control:"Slow down the entries and exits of skills you already have. Film them and aim for clean alignment from start to finish before adding difficulty.",
  consistency:"Build a sustainable training structure around rehearsals, performances, travel and recovery, so progress does not depend on a perfect week.",
  confidence:"Practise complete routines under realistic performance conditions, including filming yourself and rehearsing in front of others.",
  presence:"Work deliberately on transitions, movement finishes, musicality, intention, expression and audience connection, not only on completing the skills."
};

function goalFraming(){
  const g = goalIdx();
  if(g===1) return "As a working performer, your focus is protecting quality, durability and consistency across rehearsals, shows and travel.";
  if(g===5) return "Coming back after time away, the priority is rebuilding consistency and progressive load. This is a starting point, not a pass or fail.";
  if([2,3,4].includes(g)) return "With an opportunity ahead, put most of your training time into your top three priorities first.";
  return "Use your top three priorities as the starting point for your next training block.";
}

/* =================================================================
   STATE (sessionStorage keeps answers on back and refresh)
   ================================================================= */
const STORE_KEY = "cq_readiness_v21";
let state = blank();
function blank(){ return { key:"intro", answers:{}, name:"", email:"", instagram:"", marketing:null, submissionId:null, save:null, waitlist:false, waitlistStatus:null, waitlistAt:null, started:false }; }
let advancing = false, busy = false;
function load(){ try{ const s = JSON.parse(sessionStorage.getItem(STORE_KEY)||"null"); if(s && s.v===CONFIG.VERSION) state = Object.assign(blank(), s.data); }catch(e){} }
function persist(){ try{ sessionStorage.setItem(STORE_KEY, JSON.stringify({v:CONFIG.VERSION, data:state})); }catch(e){} }

const card = document.getElementById("card"), bar = document.getElementById("bar");
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const visibleItems = () => ITEMS.filter(it => !it.show || it.show());
const steps = () => ["intro", ...visibleItems().map(i=>i.id), "capture", "result"];
const itemById = id => ITEMS.find(i=>i.id===id);
function track(event, data){ try{ window.dataLayer = window.dataLayer || []; window.dataLayer.push(Object.assign({event}, data||{})); }catch(e){} }

function go(key){ state.key = key; persist(); render(); window.scrollTo(0,0); const h = card.querySelector("h1,.q-text,.band"); if(h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); } }
function move(delta){ const s = steps(); const i = Math.max(0, s.indexOf(state.key)); go(s[Math.max(0, Math.min(s.length-1, i+delta))]); }

function progress(){
  const s = steps(), i = s.indexOf(state.key), total = s.length-2;
  bar.style.width = (state.key==="result" ? 100 : state.key==="intro" ? 0 : (i-1)/total*100) + "%";
}

/* =================================================================
   SCORING: dimension % = avg raw / 3 x 100 ; overall = mean of dimension %
   ================================================================= */
function computeScores(){
  const dims = DIMS.map(d=>{
    const pts = ITEMS.filter(it=>it.kind==="scored" && it.dim===d.id)
      .map(it=>{ const a = state.answers[it.id]; return a==null ? null : it.opts[a][1]; })
      .filter(p=>typeof p==="number");
    const raw = pts.length ? (pts.reduce((a,b)=>a+b,0)/pts.length)/3*100 : null;
    return { id:d.id, name:d.name, raw, pct: raw==null ? null : Math.round(raw) };
  });
  const avail = dims.filter(d=>d.raw!=null);
  const overall = Math.round(avail.reduce((a,d)=>a+d.raw,0)/avail.length);
  const band = BANDS.find(b=>overall<=b.max);
  const order = DIMS.map(d=>d.id);
  const sorted = [...avail].sort((a,b)=> a.raw-b.raw || order.indexOf(a.id)-order.indexOf(b.id));
  const strongest = [...avail].sort((a,b)=> b.raw-a.raw || order.indexOf(a.id)-order.indexOf(b.id))[0];
  return { dims, overall, band, priorities: sorted.slice(0,3), strongest };
}

/* =================================================================
   RENDER
   ================================================================= */
function brand(){ return '<div class="brand"><span class="dot"></span><span class="name">CIRQUE<b>NASTICS</b></span></div>'; }
function render(){
  if(!steps().includes(state.key)) state.key = "intro";
  progress();
  if(state.key==="intro") return renderIntro();
  if(state.key==="capture") return renderCapture();
  if(state.key==="result") return renderResult();
  renderQuestion(itemById(state.key));
}

function renderIntro(){
  const resume = Object.keys(state.answers).length>0;
  card.innerHTML = `<div class="fade">
    ${brand()}
    <div class="eyebrow">Free Performance Readiness Assessment</div>
    <h1>How <span class="hl">performance ready</span> are you?</h1>
    <p class="sub">Discover your strengths, identify what may be holding you back, and find out where to focus your training next.</p>
    <p class="sub2">Whether you are preparing for an audition, already working professionally, returning after a break or simply trying to become a stronger performer, this assessment gives you a snapshot of your current preparation. Built from the physical and performance demands experienced in professional circus and live entertainment.</p>
    <div class="pillars-intro">${["Strength","Mobility","Endurance","Technical Control","Stage Presence","Training Consistency"].map(p=>`<div class="chip">${p}</div>`).join("")}</div>
    <div class="meta"><span><b>Under 5 minutes</b></span><span>&middot;</span><span>Personalised result</span><span>&middot;</span><span>Free</span></div>
    <button class="btn full" id="startBtn">${resume ? "Continue my assessment" : "Start my assessment"}</button>
    ${resume ? '<div class="center"><button class="linkbtn" id="restartBtn">Start again</button></div>' : ""}
    <p class="fineprint">No payment. Your score, priority areas and recommended next step appear at the end.</p>
  </div>`;
  document.getElementById("startBtn").onclick = ()=>{
    if(!state.started){ state.started = true; track("readiness_start"); }
    if(resume){ const next = visibleItems().find(i=>state.answers[i.id]==null); go(next ? next.id : "capture"); }
    else move(1);
  };
  const r = document.getElementById("restartBtn"); if(r) r.onclick = restart;
}

function renderQuestion(item){
  const vis = visibleItems(), number = vis.indexOf(item)+1;
  const label = item.kind==="scored" ? DIMS.find(d=>d.id===item.dim).name : item.kind==="context" ? "Context, not scored" : "About you";
  const current = state.answers[item.id];
  card.innerHTML = `<div class="fade">
    <div class="q-top"><div class="q-count">Question ${number} of ${vis.length}</div><div class="q-pillar">${esc(label)}</div></div>
    <div class="q-text" id="qt">${esc(item.q)}</div>
    ${item.help ? `<div class="q-help">${esc(item.help)}</div>` : '<div style="height:14px"></div>'}
    <div class="options" role="radiogroup" aria-labelledby="qt">
      ${item.opts.map((o,i)=>`<button type="button" class="opt ${o[2]?"na":""} ${current===i?"sel":""}" role="radio" aria-checked="${current===i}" data-i="${i}"><span class="tick"></span><span>${esc(o[0])}</span></button>`).join("")}
    </div>
    <div class="nav">
      <button type="button" class="back" id="backBtn">&larr; Back</button>
      ${current!=null ? '<button type="button" class="btn" id="nextBtn">Continue</button>' : "<span></span>"}
    </div>
  </div>`;
  card.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      if(advancing) return;
      state.answers[item.id] = Number(el.dataset.i); persist();
      card.querySelectorAll(".opt").forEach(o=>{ const on = o===el; o.classList.toggle("sel",on); o.setAttribute("aria-checked",on); });
      advancing = true;
      setTimeout(()=>{ advancing = false; move(1); }, 240);
    };
  });
  document.getElementById("backBtn").onclick = ()=>move(-1);
  const n = document.getElementById("nextBtn"); if(n) n.onclick = ()=>move(1);
}

function renderCapture(){
  const m = state.marketing;
  card.innerHTML = `<div class="fade">
    <div class="q-top"><div class="q-count">Last step</div><div class="q-pillar">Your results</div></div>
    <div class="q-text">Enter your details to see your results</div>
    <div class="q-help">Your result appears immediately on the next screen.</div>
    <form id="capForm" novalidate>
      <div class="field"><label for="f-name">First name *</label>
        <input type="text" id="f-name" autocomplete="given-name" maxlength="80" value="${esc(state.name)}" aria-describedby="e-name">
        <div class="err" id="e-name" role="alert"></div></div>
      <div class="field"><label for="f-email">Email address *</label>
        <input type="email" id="f-email" autocomplete="email" maxlength="254" value="${esc(state.email)}" aria-describedby="e-email">
        <div class="err" id="e-email" role="alert"></div></div>
      <div class="field"><label for="f-ig">Instagram handle (optional)</label>
        <input type="text" id="f-ig" maxlength="60" placeholder="@yourhandle" value="${esc(state.instagram)}"></div>
      <div class="hp" aria-hidden="true"><label for="f-web">Website</label><input type="text" id="f-web" tabindex="-1" autocomplete="off"></div>
      <fieldset aria-describedby="e-mkt">
        <legend class="fs-label">Would you like Cirquenastics to send you practical training tips, new classes and program updates by email? *</legend>
        <label class="choice"><input type="radio" name="mkt" value="yes" ${m===true?"checked":""}><span>${esc(MARKETING_TEXT)}</span></label>
        <label class="choice"><input type="radio" name="mkt" value="no" ${m===false?"checked":""}><span>No thanks, just show my results.</span></label>
        <div class="err" id="e-mkt" role="alert"></div>
      </fieldset>
      <p class="small">You can unsubscribe at any time. See our <a href="${esc(CONFIG.PRIVACY_URL)}" target="_blank" rel="noopener">Privacy Policy</a>. If you are under 16, please ask a parent or guardian before submitting.</p>
      <button type="submit" class="btn full" id="submitBtn">Show my results</button>
    </form>
    <div class="nav"><button type="button" class="back" id="backBtn">&larr; Back</button><span></span></div>
  </div>`;
  document.getElementById("backBtn").onclick = ()=>move(-1);
  document.getElementById("capForm").onsubmit = e=>{ e.preventDefault(); submitAssessment(); };
}

/* =================================================================
   SUBMIT
   ================================================================= */
function uuid(){ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==="x"?r:(r&0x3|0x8)).toString(16);}); }
function cookie(name){ const m = document.cookie.match("(^|;)\\s*"+name+"\\s*=\\s*([^;]+)"); return m ? decodeURIComponent(m.pop()) : ""; }
function timedFetch(url, opts, ms){ const c = new AbortController(); const t = setTimeout(()=>c.abort(), ms||10000); return fetch(url, Object.assign({signal:c.signal}, opts)).finally(()=>clearTimeout(t)); }
async function postJSON(url, body){
  const r = await timedFetch(url, { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json", "Accept":"application/json", "X-CSRFToken": cookie("csrftoken") }, body: JSON.stringify(body) });
  if(!r.ok) throw new Error("http "+r.status);
  const j = await r.json(); if(!j.ok) throw new Error("not ok"); return j;
}
async function web3(fields){
  if(!CONFIG.WEB3FORMS_KEY) throw new Error("no key");
  const r = await timedFetch("https://api.web3forms.com/submit", { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body: JSON.stringify(Object.assign({ access_key: CONFIG.WEB3FORMS_KEY, from_name:"Cirquenastics Assessment" }, fields)) });
  if(!r.ok) throw new Error("web3 "+r.status);
}

function answerLabel(id){ const it = itemById(id), a = state.answers[id]; if(!it || a==null || (it.show && !it.show())) return null; return it.opts[a][0]; }

function buildPayload(){
  const s = computeScores();
  const responses = visibleItems().filter(i=>i.kind!=="profile").map(it=>{
    const a = state.answers[it.id], o = a!=null ? it.opts[a] : null;
    return { id:it.id, kind:it.kind, dimension:it.dim||null, question:it.q, answer:o?o[0]:null, points:(o && typeof o[1]==="number")?o[1]:null, excluded: !!(o && o[2]) };
  });
  return {
    submission_id: state.submissionId, assessment_version: CONFIG.VERSION, submitted_at: new Date().toISOString(),
    first_name: state.name, email: state.email, instagram: state.instagram,
    goal: answerLabel("goal"), timeline: answerLabel("timeline"), discipline: answerLabel("discipline"), experience: answerLabel("level"),
    responses,
    dimensions: Object.fromEntries(s.dims.map(d=>[d.id, d.pct])),
    overall: s.overall, band: s.band.key, band_name: s.band.name,
    priorities: s.priorities.map(p=>p.id),
    injury_current: state.answers.injury===0, injury_answer: answerLabel("injury"),
    footage_answer: answerLabel("footage"),
    marketing_consent: state.marketing===true, marketing_text: state.marketing ? MARKETING_TEXT : "",
    club_waitlist: state.waitlist,
    website: (document.getElementById("f-web")||{}).value || ""
  };
}

async function saveSubmission(){
  const p = buildPayload();
  if(CONFIG.SUBMIT_URL){
    try{ const j = await postJSON(CONFIG.SUBMIT_URL, p); return { status:"saved", emailed: !!j.email_sent, via:"site" }; }catch(e){}
  }
  try{
    const f = { botcheck: p.website, subject:`New Performance Readiness Lead: ${p.first_name}, ${p.overall}/100`,
      "Submission ID": p.submission_id, "Submitted at": p.submitted_at, "First name": p.first_name, "Email": p.email, "Instagram": p.instagram || "-",
      "Goal": p.goal, "Timeline": p.timeline || "-", "Discipline": p.discipline, "Experience": p.experience,
      "Overall": `${p.overall}/100 (${p.band_name})`, "Top 3 priorities": p.priorities.join(", "),
      "Current pain/injury": p.injury_current ? "YES" : "NO", "Footage": p.footage_answer || "-",
      "Marketing email preference": p.marketing_consent ? "YES" : "NO", "Club waitlist": p.club_waitlist ? "YES" : "NO" };
    DIMS.forEach(d=>{ f["Dimension: "+d.name] = (p.dimensions[d.id]==null ? "-" : p.dimensions[d.id]+"%"); });
    p.responses.forEach(r=>{ f[r.question] = r.answer + (r.points!=null ? ` (${r.points})` : ""); });
    await web3(f);
    return { status:"saved", emailed:false, via:"fallback" };
  }catch(e){}
  return { status:"failed", emailed:false };
}

async function submitAssessment(){
  if(busy) return;
  const nameEl = document.getElementById("f-name"), emailEl = document.getElementById("f-email");
  const name = nameEl.value.trim(), email = emailEl.value.trim();
  const mkt = (document.querySelector('input[name="mkt"]:checked')||{}).value;
  let ok = true;
  const setErr = (el, id, msg)=>{ document.getElementById(id).textContent = msg; if(el) el.setAttribute("aria-invalid", msg ? "true" : "false"); if(msg) ok = false; };
  setErr(nameEl, "e-name", name ? "" : "Please enter your first name.");
  setErr(emailEl, "e-email", /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? "" : "Please enter a valid email address.");
  setErr(null, "e-mkt", mkt ? "" : "Please choose one option.");
  if(!ok){ (!name ? nameEl : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email) ? emailEl : document.querySelector('input[name="mkt"]')).focus(); return; }

  const missing = visibleItems().find(i=>state.answers[i.id]==null);
  if(missing){ go(missing.id); return; }

  state.name = name; state.email = email; state.instagram = document.getElementById("f-ig").value.trim().slice(0,60);
  state.marketing = (mkt==="yes");
  if(!state.submissionId) state.submissionId = uuid();
  persist();

  busy = true;
  const btn = document.getElementById("submitBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  state.save = await saveSubmission();
  busy = false; persist();
  const s = computeScores();
  track("readiness_complete", { readiness_score: s.overall, readiness_band: s.band.key, readiness_goal: goalIdx(), marketing_opt_in: state.marketing });
  go("result");
}

async function retrySave(){
  const b = document.getElementById("retryBtn"); if(b){ b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; }
  state.save = await saveSubmission(); persist(); renderResult();
}

async function joinWaitlist(){
  if(busy || state.waitlist) return;
  busy = true;
  const b = document.getElementById("clubBtn"); if(b){ b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; }
  const joinedAt = new Date().toISOString();
  let done = false;
  if(CONFIG.WAITLIST_URL){
    try{ await postJSON(CONFIG.WAITLIST_URL, { submission_id: state.submissionId, email: state.email, wording: WAITLIST_TEXT, joined_at: joinedAt }); done = true; }catch(e){}
  }
  if(!done){
    try{ await web3({ subject:`Club waitlist join: ${state.name} <${state.email}>`, "Submission ID": state.submissionId, "First name": state.name, "Email": state.email, "Club waitlist": "YES", "Joined at": joinedAt, "Wording shown": WAITLIST_TEXT }); done = true; }catch(e){}
  }
  busy = false;
  if(done){ state.waitlist = true; state.waitlistAt = joinedAt; state.waitlistStatus = "ok"; track("readiness_waitlist_join"); }
  else state.waitlistStatus = "failed";
  persist(); renderResult();
}

function restart(){ state = blank(); try{ sessionStorage.removeItem(STORE_KEY); }catch(e){} go("intro"); }

/* =================================================================
   RESULTS
   ================================================================= */
function renderResult(){
  if(visibleItems().some(i=>state.answers[i.id]==null) || !state.email){ go("intro"); return; }
  const s = computeScores(), b = s.band;
  const first = esc((state.name||"").split(" ")[0]);
  const radius = 80, circ = 2*Math.PI*radius, offset = circ*(1 - s.overall/100);
  const colorFor = pct => pct<40 ? "#E07A5A" : pct<60 ? "#E8B44C" : pct<80 ? "#7FB8C9" : "#6FBF8E";

  let notice = "";
  if(state.save && state.save.status==="failed") notice = `<div class="notice warn"><span>We could not save your results just now. Your results are below.</span><button class="btn" id="retryBtn">Try again</button></div>`;
  else if(state.save && state.save.emailed) notice = `<div class="notice ok"><span>A copy of your results has been sent to ${esc(state.email)}.</span></div>`;

  const notes = [];
  if(state.answers.injury===0) notes.push(`<div class="note safety"><b>A note on pain or injury</b>If you are currently dealing with pain or injury, consider getting appropriate clinical guidance before increasing training load.</div>`);
  if(hasOpportunity() && state.answers.timeline===0) notes.push(`<div class="note time"><b>Four weeks or less</b>Prioritise quality, consistency and recovery rather than large last minute training changes.</div>`);
  if(isCasting() && state.answers.footage!=null && state.answers.footage<3) notes.push(`<div class="note cast"><b>Casting material</b>Update your footage so it accurately represents your present level. Current, well filmed material is often what gets you seen.</div>`);

  const club = state.waitlist
    ? `<p class="done">You're on the list. We'll email you when the Cirquenastics Club opens.</p>`
    : `<button class="btn ghost full" id="clubBtn">Join the Club waitlist</button>${state.waitlistStatus==="failed" ? '<p class="small" style="margin-top:10px">We could not add you just now. Please try again.</p>' : ""}`;

  card.innerHTML = `<div class="fade">
    ${brand()}
    ${notice}
    <div class="score-ring">
      <svg width="180" height="180" aria-hidden="true">
        <circle cx="90" cy="90" r="${radius}" stroke="#1B2E48" stroke-width="11" fill="none"/>
        <circle cx="90" cy="90" r="${radius}" stroke="${b.color}" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ring" style="transition:stroke-dashoffset 1.1s ease"/>
      </svg>
      <div class="val"><div class="num">${s.overall}</div><div class="den">OUT OF 100</div></div>
    </div>
    <div class="band" style="color:${b.color}">${esc(b.name)}</div>
    <div class="band-tag">${first ? first+", here is your result" : "Your result"}</div>
    <p class="body-text">${esc(b.text)}</p>
    <p class="body-text">${esc(goalFraming())}</p>
    <p class="disclaimer">This is a self-assessment designed to help identify training priorities. It is not a medical evaluation, professional certification, casting decision or guarantee of performance readiness.</p>

    <h3>Your performance readiness</h3>
    ${s.dims.map(d=>`<div class="dim-row"><div class="dim-head"><span>${esc(d.name)}</span><span style="color:${colorFor(d.pct)}">${d.pct}%</span></div><div class="bar"><i data-w="${d.pct}" style="background:${colorFor(d.pct)}"></i></div></div>`).join("")}
    <p class="strong-line">Strongest area: <b>${esc(s.strongest.name)}</b></p>

    <h3>Your top 3 priorities</h3>
    ${s.priorities.map((p,i)=>`<div class="prio"><div class="n">${i+1}</div><div><strong>${esc(p.name)}</strong><p>${esc(REC[p.id])}</p></div></div>`).join("")}
    ${notes.join("")}

    <div class="cta-box">
      <h4>Want personalised feedback on what to work on next?</h4>
      <p>Get a Cirquenastics Performance Review for £67. Joseane reviews your submitted performance or training material and gives you personalised feedback on your current priorities and the most useful next steps for your training.</p>
      <p class="deliver">You send 3 to 5 short videos. You receive a written report, usually within 5 to 7 days.</p>
      <a class="btn full" id="reviewBtn" href="${esc(CONFIG.REVIEW_URL)}">Get my £67 Performance Review</a>
    </div>

    <div class="club">
      <div class="eyebrow">Cirquenastics Club, coming soon</div>
      <p>Short, performer specific training sessions in strength, mobility, conditioning, Pilates, yoga, stage presence and more, designed to fit around rehearsals, shows and real performer life. Be one of the first to know when membership opens.</p>
      ${club}
    </div>

    <div class="center" style="margin-top:16px">
      <button class="linkbtn" id="editBtn">Change my answers</button>
      <button class="linkbtn" id="restartBtn">Retake the assessment</button>
    </div>
  </div>`;

  requestAnimationFrame(()=>{
    const ring = document.getElementById("ring"); if(ring) ring.style.strokeDashoffset = offset;
    card.querySelectorAll(".bar i").forEach(i=>{ i.style.width = Math.max(4, Number(i.dataset.w))+"%"; });
  });
  const r = document.getElementById("retryBtn"); if(r) r.onclick = retrySave;
  const c = document.getElementById("clubBtn"); if(c) c.onclick = joinWaitlist;
  document.getElementById("reviewBtn").onclick = ()=>track("readiness_review_click", { readiness_score: s.overall });
  document.getElementById("editBtn").onclick = ()=>go(visibleItems()[0].id);
  document.getElementById("restartBtn").onclick = restart;
}

load();
render();
</script>
</body>
</html>
